<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Simulação Plug & Charge - Posto Completo v5.4</title>
    <style>
        :root { --primary: #00f2ff; --bg: #0a0b10; --panel: rgba(16, 18, 27, 0.93); --danger: #ff2222; --action: #00ff88; }
        body { margin: 0; overflow: hidden; background: #87ceeb; font-family: 'Segoe UI', sans-serif; }
        
        #ui-panel { 
            position: absolute; top: 20px; left: 20px; width: 360px; 
            background: var(--panel); border: 1px solid rgba(0, 242, 255, 0.3); 
            border-radius: 12px; padding: 20px; color: white; 
            box-shadow: 0 8px 32px rgba(0,0,0,0.3); z-index: 100;
            backdrop-filter: blur(5px);
        }
        
        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        h1 { font-size: 13px; color: var(--primary); text-transform: uppercase; margin: 0; letter-spacing: 2px; }
        
        .metric { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 13px; }
        .label { color: #aaa; } .value { font-family: 'Courier New', monospace; font-weight: bold; color: var(--primary); }
        
        .height-controls { display: flex; gap: 10px; margin: 10px 0; }
        .btn-height { flex: 1; padding: 6px; font-size: 11px; background: #222; border: 1px solid #555; color: #fff; border-radius: 4px; cursor: pointer; }
        .btn-height:hover { border-color: var(--primary); color: var(--primary); }

        .battery-container { width: 100%; height: 18px; background: #222; border-radius: 4px; overflow: hidden; margin: 8px 0; border: 1px solid #444; }
        #battery-level { width: 15%; height: 100%; background: linear-gradient(90deg, #ff3300, #00f2ff); transition: width 0.3s; }
        
        #main-status { text-align: center; padding: 10px; background: rgba(0,0,0,0.4); border-radius: 6px; margin-top: 15px; font-weight: bold; text-transform: uppercase; font-size: 11px; color: #ffaa00; border: 1px solid #444; }
        
        #controls { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 15px; z-index: 100; }
        
        button { background: #111; border: 1px solid var(--primary); color: var(--primary); padding: 12px 22px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: all 0.3s; text-transform: uppercase; font-size: 11px; }
        button:hover { background: var(--primary); color: #000; box-shadow: 0 0 15px var(--primary); }
        button:disabled { border-color: #333 !important; color: #555 !important; cursor: not-allowed; background: #050505 !important; }
        
        .btn-mini { padding: 6px 14px; font-size: 10px; border-radius: 6px; }
        .btn-action { border-color: var(--action); color: var(--action); }
        .btn-action:hover { background: var(--action); color: #000; box-shadow: 0 0 15px var(--action); }
        .btn-emergency { border-color: var(--danger); color: var(--danger); }
        .btn-emergency:hover { background: var(--danger); color: #fff; box-shadow: 0 0 20px var(--danger); }
    </style>
</head>
<body>

    <div id="ui-panel">
        <div class="panel-header">
            <h1>Plug & Charge v5.4</h1>
            <button id="start-btn" class="btn-mini" onclick="iniciar()">Iniciar Simulação</button>
        </div>
        
        <div class="metric"><span class="label">Veículo:</span><span class="value" style="color: #fff;">BYD Dolphin Mini</span></div>
        <div class="metric"><span class="label">Distância Sensor:</span><span id="dist-val" class="value">7.69 m</span></div>
        <div class="metric"><span class="label">Altura do Atuador:</span><span id="alt-val" class="value">0.45 m</span></div>
        
        <div style="margin: 10px 0 5px 0; font-size: 11px; color: #888; text-transform: uppercase; font-weight: bold;">Ajuste Fino de Altura (Manual):</div>
        <div class="height-controls">
            <button class="btn-height" onclick="subirAtuador()">▲ Subir</button>
            <button class="btn-height" onclick="descerAtuador()">▼ Descer</button>
        </div>

        <div class="metric"><span class="label">Atuador Robótico:</span><span id="act-val" class="value">Recuado</span></div>
        <div class="metric"><span class="label">Conector Magnético:</span><span id="mag-val" class="value">OFF</span></div>
        
        <div style="margin-top: 10px;">
            <div class="metric"><span class="label">Nível de Carga:</span><span id="bat-perc" class="value">15%</span></div>
            <div class="battery-container"><div id="battery-level"></div></div>
        </div>
        <div id="main-status">Aguardando Aproximação</div>
    </div>

    <div id="controls">
        <button id="actuator-btn" class="btn-action" onclick="acionarAtuador()" disabled>Acionar Atuador</button>
        <button id="stop-btn" class="btn-emergency" onclick="botaoStopEmergencia()">E-STOP (PARAR)</button>
        <button id="reset-btn" onclick="resetar()">Resetar Cenario</button>
    </div>

    <canvas id="totem-screen-canvas" width="256" height="128" style="display: none;"></canvas>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        const ESP32_IP = "http://10.191.123.173"; 
        let simulacaoAtiva = false; 

        // --- AMBIENTE 3D ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.Fog(0x87ceeb, 25, 120);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(14, 9, 16);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.outputEncoding = THREE.sRGBEncoding;
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, 1.5, 2);

        // Luzes
        const sunLight = new THREE.DirectionalLight(0xffffff, 1.3);
        sunLight.position.set(15, 25, 10);
        sunLight.castShadow = true;
        scene.add(sunLight);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        // Pista
        const pistaGeo = new THREE.PlaneGeometry(16, 40);
        const pistaMat = new THREE.MeshStandardMaterial({ color: 0x282828, roughness: 0.85 });
        const pista = new THREE.Mesh(pistaGeo, pistaMat); pista.rotation.x = -Math.PI / 2; pista.receiveShadow = true;
        scene.add(pista);

        // Estruturas Decorativas
        const calcadaMat = new THREE.MeshStandardMaterial({ color: 0xaaaaaa });
        const gramaMat = new THREE.MeshStandardMaterial({ color: 0x3b7a3b });
        const calcadaEsq = new THREE.Mesh(new THREE.BoxGeometry(10, 0.15, 40), calcadaMat); calcadaEsq.position.set(-13, 0.075, 0); scene.add(calcadaEsq);
        const gramaEsq = new THREE.Mesh(new THREE.PlaneGeometry(9.6, 39.6), gramaMat); gramaEsq.rotation.x = -Math.PI/2; gramaEsq.position.set(-13, 0.16, 0); scene.add(gramaEsq);
        const calcadaDir = new THREE.Mesh(new THREE.BoxGeometry(10, 0.15, 40), calcadaMat); calcadaDir.position.set(13, 0.075, 0); scene.add(calcadaDir);
        const gramaDir = new THREE.Mesh(new THREE.PlaneGeometry(9.6, 39.6), gramaMat); gramaDir.rotation.x = -Math.PI/2; gramaDir.position.set(13, 0.16, 0); scene.add(gramaDir);

        const vagaGroup = new THREE.Group();
        const areaVerde = new THREE.Mesh(new THREE.PlaneGeometry(3.6, 6.5), new THREE.MeshStandardMaterial({ color: 0x1b5e20, roughness: 0.6 }));
        areaVerde.rotation.x = -Math.PI / 2; areaVerde.position.set(0, 0.01, 2.5); vagaGroup.add(areaVerde);
        const linhaMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
        const l1 = new THREE.Mesh(new THREE.PlaneGeometry(0.12, 6.5), linhaMat); l1.rotation.x = -Math.PI / 2; l1.position.set(-1.8, 0.02, 2.5);
        const l2 = l1.clone(); l2.position.x = 1.8;
        const lTraseira = new THREE.Mesh(new THREE.PlaneGeometry(3.6, 0.12), linhaMat); lTraseira.rotation.x = -Math.PI / 2; lTraseira.position.set(0, 0.02, 5.75);
        vagaGroup.add(l1, l2, lTraseira); scene.add(vagaGroup);

        const teto = new THREE.Mesh(new THREE.BoxGeometry(15, 0.5, 9), new THREE.MeshStandardMaterial({ color: 0xeeeeee })); teto.position.set(0, 7, 1); scene.add(teto);
        const pilar1 = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 7), new THREE.MeshStandardMaterial({ color: 0xeeeeee })); pilar1.position.set(-5, 3.5, -2); scene.add(pilar1);
        const pilar2 = pilar1.clone(); pilar2.position.x = 5; scene.add(pilar2);

        // --- TEXTURA DA TELA ---
        const canvasTela = document.getElementById('totem-screen-canvas');
        const ctxTela = canvasTela.getContext('2d');
        const texturaTela = new THREE.CanvasTexture(canvasTela);

        function atualizarDisplayTotem(txt1, txt2) {
            ctxTela.fillStyle = '#001a33'; ctxTela.fillRect(0, 0, 256, 128);
            ctxTela.strokeStyle = '#00f2ff'; ctxTela.lineWidth = 6; ctxTela.strokeRect(4, 4, 248, 120);
            ctxTela.fillStyle = '#00f2ff'; ctxTela.font = 'bold 22px monospace'; ctxTela.textAlign = 'center'; ctxTela.fillText(txt1, 128, 50);
            ctxTela.fillStyle = '#00ff88'; ctxTela.font = 'bold 26px monospace'; ctxTela.fillText(txt2, 128, 95); texturaTela.needsUpdate = true;
        }
        atualizarDisplayTotem("SISTEMA READY", "DIST: 7.69m");

        // --- CARREGADOR / TOTEM ---
        const totemGroup = new THREE.Group(); totemGroup.position.set(0, 0, -1.2);
        const corpoTotem = new THREE.Mesh(new THREE.BoxGeometry(1.5, 3.8, 0.8), new THREE.MeshStandardMaterial({color: 0x242528, roughness: 0.5})); corpoTotem.position.y = 1.9; totemGroup.add(corpoTotem);

        const displayDigital = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 0.55), new THREE.MeshBasicMaterial({map: texturaTela})); displayDigital.position.set(0, 2.5, 0.41); totemGroup.add(displayDigital);
        const ledVermelho = new THREE.Mesh(new THREE.SphereGeometry(0.05, 16, 16), new THREE.MeshStandardMaterial({color: 0xff0000, emissive: 0xff0000})); ledVermelho.position.set(-0.35, 3.3, 0.41); totemGroup.add(ledVermelho);
        const ledVerde = new THREE.Mesh(new THREE.SphereGeometry(0.05, 16, 16), new THREE.MeshStandardMaterial({color: 0x002200, emissive: 0x000000})); ledVerde.position.set(0.35, 3.3, 0.41); totemGroup.add(ledVerde);

        // --- MECANISMO DO ATUADOR ---
        const movableArm = new THREE.Group(); movableArm.position.set(0, 0.45, 0.4); 
        const baseMecanica = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.4, 0.3), new THREE.MeshStandardMaterial({color: 0x0d0e10})); baseMecanica.castShadow = true; movableArm.add(baseMecanica);
        const hastePiston = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.6, 16), new THREE.MeshStandardMaterial({color: 0xcccccc, metalness: 0.9})); hastePiston.rotation.x = Math.PI/2; hastePiston.position.z = 0.3; movableArm.add(hastePiston);
        const acopladorNegro = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.1, 32), new THREE.MeshStandardMaterial({color: 0x333333})); acopladorNegro.rotation.x = Math.PI/2; acopladorNegro.position.z = 0.6;
        movableArm.add(acopladorNegro); totemGroup.add(movableArm); scene.add(totemGroup);

        // --- VEÍCULO ---
        const carGroup = new THREE.Group(); carGroup.position.set(0, 0, 9);
        const gltfLoader = new THREE.GLTFLoader();
        gltfLoader.load('scene.gltf', (gltf) => {
            const carModel = gltf.scene; const box = new THREE.Box3().setFromObject(carModel); const size = box.getSize(new THREE.Vector3()); const center = box.getCenter(new THREE.Vector3());
            carModel.position.x += (carModel.position.x - center.x); carModel.position.y += (carModel.position.y - center.y); carModel.position.z += (carModel.position.z - center.z);
            carModel.scale.set(3.4/size.z, 3.4/size.z, 3.4/size.z); carGroup.add(carModel);
        }, undefined, (e) => {
            const chassi = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.7, 3.4), new THREE.MeshStandardMaterial({ color: 0x00f2ff })); chassi.position.y = 0.45; carGroup.add(chassi);
        });

        const moduloReceptorFemea = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.22, 0.04), new THREE.MeshStandardMaterial({color: 0xffaa00}));
        moduloReceptorFemea.position.set(0, 0.45, -1.71); carGroup.add(moduloReceptorFemea); scene.add(carGroup);

        // --- VARIÁVEIS DE ESTADO VIRTUAL ---
        let state = "IDLE"; let distance = 7.69; let battery = 15;
        const uiDist = document.getElementById('dist-val'); const uiAct = document.getElementById('act-val');
        const uiMag = document.getElementById('mag-val'); const uiStat = document.getElementById('main-status');
        const uiBatTxt = document.getElementById('bat-perc'); const uiBatBar = document.getElementById('battery-level');
        const btnActuator = document.getElementById('actuator-btn');

        function iniciar() { 
            simulacaoAtiva = true; 
            document.getElementById('start-btn').disabled = true; 
            uiStat.innerText = "Simulação Iniciada. Aguardando dados do hardware...";
        }

        function acionarAtuador() { 
            if(state === "PARKED_WAITING") {
                state = "ACTUATOR_MOVING"; 
                btnActuator.disabled = true;
                fetch(`${ESP32_IP}/action_ligar`).catch(err => console.log("Aviso de envio"));
            }
        }

        function botaoStopEmergencia() { 
            state = "E_STOP"; 
            btnActuator.disabled = true;
            fetch(`${ESP32_IP}/action_desligar`).catch(err => console.log("Aviso de envio"));
        }

        function resetar() {
            state = "IDLE"; battery = 15; carGroup.position.set(0, 0, 9); distance = 7.69;
            movableArm.position.z = 0.4; btnActuator.disabled = true; document.getElementById('start-btn').disabled = false;
            uiStat.innerText = "Aguardando Aproximação"; uiStat.style.color = ""; uiAct.innerText = "Recuado"; uiMag.innerText = "OFF"; uiMag.style.color = "";
            ledVermelho.material.emissive.setHex(0xff0000); ledVerde.material.emissive.setHex(0x000000);
            fetch(`${ESP32_IP}/action_reset`).catch(() => {});
        }

        function subirAtuador() { if(movableArm.position.y < 1.0) movableArm.position.y += 0.02; document.getElementById('alt-val').innerText = movableArm.position.y.toFixed(2) + " m"; }
        function descerAtuador() { if(movableArm.position.y > 0.2) movableArm.position.y -= 0.02; document.getElementById('alt-val').innerText = movableArm.position.y.toFixed(2) + " m"; }

        // ========================================================
        // LOOP IOT SINCRONIZADO 
        // ========================================================
        setInterval(() => {
            if (!simulacaoAtiva) return;

            fetch(ESP32_IP, { method: 'GET', mode: 'cors' })
                .then(response => response.json())
                .then(data => {
                    const statusHardware = data.status;
                    
                    if (statusHardware == 3 && state !== "E_STOP") { state = "E_STOP"; }
                    if (statusHardware == 0 && state === "E_STOP") { state = "IDLE"; }

                    if(state !== "ACTUATOR_MOVING" && state !== "COUPLING" && state !== "CHARGING" && state !== "FINISHED" && state !== "E_STOP") {
                        distance = data.distance;
                        carGroup.position.z = distance + 1.71 - 0.4;
                        
                        if (distance <= 0.48) {
                            state = "PARKED_WAITING";
                            btnActuator.disabled = false;
                        } else {
                            state = "IDLE";
                            btnActuator.disabled = true;
                        }
                    }
                })
                .catch(err => { console.log("Sincronizando barramento..."); });
        }, 200);

        function animate() {
            requestAnimationFrame(animate); controls.update();
            uiDist.innerText = distance.toFixed(2) + " m";
            uiBatTxt.innerText = Math.floor(battery) + "%"; uiBatBar.style.width = battery + "%";

            switch (state) {
                case "IDLE":
                    uiStat.innerText = "Aguardando Aproximação"; uiStat.style.color = "";
                    atualizarDisplayTotem("APROXIME O EV", "DIST: " + distance.toFixed(2) + "m");
                    break;
                case "PARKED_WAITING":
                    uiStat.innerText = "VE DETECTADO"; uiStat.style.color = "#00ff88";
                    atualizarDisplayTotem("VE DETECTADO", "DIST: " + distance.toFixed(2) + "m");
                    break;
                case "ACTUATOR_MOVING":
                    uiStat.innerText = "Avançando Atuador..."; uiAct.innerText = "Avançando...";
                    atualizarDisplayTotem("CONECTANDO...", "AGUARDE Z");
                    if (movableArm.position.z < 0.56) { movableArm.position.z += 0.006; } else { state = "COUPLING"; }
                    break;
                case "E_STOP":
                    uiStat.innerText = "EMERGÊNCIA ATIVADA"; uiStat.style.color = "#ff2222";
                    atualizarDisplayTotem("⚠️ E-STOP! ⚠️", "RETIDO");
                    ledVermelho.material.emissive.setHex(0xff0000); ledVerde.material.emissive.setHex(0x000000);
                    if (movableArm.position.z > 0.4) movableArm.position.z -= 0.02;
                    break;
                case "COUPLING":
                    uiMag.innerText = "ON (CONECTADO)"; uiMag.style.color = "#00ff88"; uiAct.innerText = "Acoplado";
                    ledVermelho.material.emissive.setHex(0x000000); ledVerde.material.emissive.setHex(0x00ff00);
                    state = "CHARGING";
                    break;
                case "CHARGING":
                    uiStat.innerText = "Energia ativa: Carregamento em curso"; uiStat.style.color = "#00ff88";
                    
                    // INCREMENTA A BATERIA ATE 100%
                    if (battery < 100) {
                        battery += 0.12; 
                        atualizarDisplayTotem("CARREGANDO EV", "BAT: " + Math.floor(battery) + "%");
                    } else { 
                        // INTERRUPÇÃO AUTOMÁTICA EM 100%
                        state = "FINISHED";
                        fetch(`${ESP32_IP}/action_finalizar`).catch(() => {});
                    }
                    break;
                case "FINISHED":
                    uiStat.innerText = "CARREGAMENTO FINALIZADO"; uiStat.style.color = "#00ff88";
                    uiAct.innerText = "Concluído";
                    atualizarDisplayTotem("CONCLUIDO!", "100% CARREGADO");
                    ledVermelho.material.emissive.setHex(0x000000); ledVerde.material.emissive.setHex(0x00ff00);
                    break;
            }
            renderer.render(scene, camera);
        }
        window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
        animate();
    </script>
</body>
</html>
