<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Simulação Plug & Charge - Posto Completo v5.1</title>
    <style>
        :root { --primary: #00f2ff; --bg: #0a0b10; --panel: rgba(16, 18, 27, 0.93); --danger: #ff2222; --action: #00ff88; }
        body { margin: 0; overflow: hidden; background: #87ceeb; font-family: 'Segoe UI', sans-serif; }
        
        /* Painel de Monitoramento */
        #ui-panel { 
            position: absolute; top: 20px; left: 20px; width: 360px; 
            background: var(--panel); border: 1px solid rgba(0, 242, 255, 0.3); 
            border-radius: 12px; padding: 20px; color: white; 
            box-shadow: 0 8px 32px rgba(0,0,0,0.3); z-index: 100;
            backdrop-filter: blur(5px);
        }
        
        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        h1 { font-size: 13px; color: var(--primary); text-transform: uppercase; margin: 0; letter-spacing: 2px; }
        
        .metric { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 13px; }
        .label { color: #aaa; } .value { font-family: 'Courier New', monospace; font-weight: bold; color: var(--primary); }
        
        /* Controles de Ajuste Manual de Altura */
        .height-controls { display: flex; gap: 10px; margin: 10px 0; }
        .btn-height { flex: 1; padding: 6px; font-size: 11px; background: #222; border: 1px solid #555; color: #fff; border-radius: 4px; cursor: pointer; }
        .btn-height:hover { border-color: var(--primary); color: var(--primary); }

        .battery-container { width: 100%; height: 18px; background: #222; border-radius: 4px; overflow: hidden; margin: 8px 0; border: 1px solid #444; }
        #battery-level { width: 15%; height: 100%; background: linear-gradient(90deg, #ff3300, #00f2ff); transition: width 0.3s; }
        
        #main-status { text-align: center; padding: 10px; background: rgba(0,0,0,0.4); border-radius: 6px; margin-top: 15px; font-weight: bold; text-transform: uppercase; font-size: 11px; color: #ffaa00; border: 1px solid #444; }
        
        /* Controles Inferiores */
        #controls { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 15px; z-index: 100; }
        
        button { background: #111; border: 1px solid var(--primary); color: var(--primary); padding: 12px 22px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: all 0.3s; text-transform: uppercase; font-size: 11px; }
        button:hover { background: var(--primary); color: #000; box-shadow: 0 0 15px var(--primary); }
        button:disabled { border-color: #333 !important; color: #555 !important; cursor: not-allowed; background: #050505 !important; }
        
        .btn-mini { padding: 6px 14px; font-size: 10px; border-radius: 6px; }
        .btn-action { border-color: var(--action); color: var(--action); }
        .btn-action:hover { background: var(--action); color: #000; box-shadow: 0 0 15px var(--action); }
        .btn-emergency { border-color: var(--danger); color: var(--danger); }
        .btn-emergency:hover { background: var(--danger); color: #fff; box-shadow: 0 0 20px var(--danger); }
    </style>
</head>
<body>

    <div id="ui-panel">
        <div class="panel-header">
            <h1>Plug & Charge v5.1</h1>
            <button id="start-btn" class="btn-mini" onclick="iniciar()">Iniciar Simulação</button>
        </div>
        
        <div class="metric"><span class="label">Veículo:</span><span class="value" style="color: #fff;">BYD Dolphin Mini</span></div>
        <div class="metric"><span class="label">Distância Sensor:</span><span id="dist-val" class="value">5.00 m</span></div>
        <div class="metric"><span class="label">Altura do Atuador:</span><span id="alt-val" class="value">0.45 m</span></div>
        
        <div style="margin: 10px 0 5px 0; font-size: 11px; color: #888; text-transform: uppercase; font-weight: bold;">Ajuste Fino de Altura (Manual):</div>
        <div class="height-controls">
            <button class="btn-height" onclick="subirAtuador()">▲ Subir</button>
            <button class="btn-height" onclick="descerAtuador()">▼ Descer</button>
        </div>

        <div class="metric"><span class="label">Atuador Robótico:</span><span id="act-val" class="value">Recuado</span></div>
        <div class="metric"><span class="label">Conector Magnético:</span><span id="mag-val" class="value">OFF</span></div>
        
        <div style="margin-top: 10px;">
            <div class="metric"><span class="label">Nível de Carga:</span><span id="bat-perc" class="value">15%</span></div>
            <div class="battery-container"><div id="battery-level"></div></div>
        </div>
        <div id="main-status">Conectando à Nuvem...</div>

        <div style="margin-top: 12px; border-top: 1px solid #333; padding-top: 10px;">
            <div style="font-size: 11px; color: #888; text-transform: uppercase; font-weight: bold; margin-bottom: 5px;">
                Simular Aproximação (Sem Sensor):
            </div>
            <input type="range" id="sim-dist-slider" min="0.40" max="5.00" step="0.05" value="5.00" style="width: 100%; cursor: pointer;" oninput="atualizarDistanciaManual(this.value)">
        </div>
    </div>

    <div id="controls">
        <button id="actuator-btn" class="btn-action" onclick="acionarAtuador()" disabled>Acionar Atuador</button>
        <button id="stop-btn" class="btn-emergency" onclick="botaoStopEmergencia()">E-STOP (PARAR)</button>
        <button id="reset-btn" onclick="resetar()">Resetar Cenario</button>
    </div>

    <canvas id="totem-screen-canvas" width="256" height="128" style="display: none;"></canvas>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://unpkg.com/mqtt@4.3.7/dist/mqtt.min.js"></script>

    <script>
        // ==========================================
        // CONFIGURAÇÃO DE CONEXÃO IOT EM NUVEM (MQTT)
        // ==========================================
        const MQTT_BROKER_WSS = "wss://broker.hivemq.com:8884/mqtt";
        const TOPIC_CMD       = "lzinnbarbosa/plugcharge/cmd";
        const TOPIC_STATUS    = "lzinnbarbosa/plugcharge/status";

        const mqttClient = mqtt.connect(MQTT_BROKER_WSS);
        let simulacaoAtiva = false;
        let ultimoEstadoEnviado = "";
        let cargaConcluidaEnviada = false;

        // --- AMBIENTE 3D ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.Fog(0x87ceeb, 25, 120);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(14, 9, 16);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.outputEncoding = THREE.sRGBEncoding;
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, 1.5, 2);

        // Luzes
        const sunLight = new THREE.DirectionalLight(0xffffff, 1.3);
        sunLight.position.set(15, 25, 10);
        sunLight.castShadow = true; sunLight.shadow.mapSize.width = 2048; sunLight.shadow.mapSize.height = 2048;
        scene.add(sunLight);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        // --- CONSTRUÇÃO DO POSTO ---
        const pistaGeo = new THREE.PlaneGeometry(16, 40);
        const pistaMat = new THREE.MeshStandardMaterial({ color: 0x282828, roughness: 0.85 });
        const pista = new THREE.Mesh(pistaGeo, pistaMat); pista.rotation.x = -Math.PI / 2; pista.receiveShadow = true;
        scene.add(pista);

        const calcadaMat = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, roughness: 0.7 });
        const gramaMat = new THREE.MeshStandardMaterial({ color: 0x3b7a3b, roughness: 0.9 });

        const calcadaEsq = new THREE.Mesh(new THREE.BoxGeometry(10, 0.15, 40), calcadaMat); calcadaEsq.position.set(-13, 0.075, 0); calcadaEsq.receiveShadow = true; scene.add(calcadaEsq);
        const gramaEsq = new THREE.Mesh(new THREE.PlaneGeometry(9.6, 39.6), gramaMat); gramaEsq.rotation.x = -Math.PI/2; gramaEsq.position.set(-13, 0.16, 0); scene.add(gramaEsq);

        const calcadaDir = new THREE.Mesh(new THREE.BoxGeometry(10, 0.15, 40), calcadaMat); calcadaDir.position.set(13, 0.075, 0); calcadaDir.receiveShadow = true; scene.add(calcadaDir);
        const gramaDir = new THREE.Mesh(new THREE.PlaneGeometry(9.6, 39.6), gramaMat); gramaDir.rotation.x = -Math.PI/2; gramaDir.position.set(13, 0.16, 0); scene.add(gramaDir);

        // Vaga
        const vagaGroup = new THREE.Group();
        const areaVerde = new THREE.Mesh(new THREE.PlaneGeometry(3.6, 6.5), new THREE.MeshStandardMaterial({ color: 0x1b5e20, roughness: 0.6 }));
        areaVerde.rotation.x = -Math.PI / 2; areaVerde.position.set(0, 0.01, 2.5); areaVerde.receiveShadow = true; vagaGroup.add(areaVerde);
        const linhaMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
        const l1 = new THREE.Mesh(new THREE.PlaneGeometry(0.12, 6.5), linhaMat); l1.rotation.x = -Math.PI / 2; l1.position.set(-1.8, 0.02, 2.5);
        const l2 = l1.clone(); l2.position.x = 1.8;
        const lTraseira = new THREE.Mesh(new THREE.PlaneGeometry(3.6, 0.12), linhaMat); lTraseira.rotation.x = -Math.PI / 2; lTraseira.position.set(0, 0.02, 5.75);
        vagaGroup.add(l1, l2, lTraseira); scene.add(vagaGroup);

        function criarArvore(x, z) {
            const arvore = new THREE.Group();
            const tronco = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.2, 2.5), new THREE.MeshStandardMaterial({color: 0x5a3d28})); tronco.position.y = 1.25;
            const copa = new THREE.Mesh(new THREE.SphereGeometry(1.2, 16, 16), new THREE.MeshStandardMaterial({color: 0x1b4314, roughness: 0.8})); copa.position.y = 2.8;
            arvore.add(tronco, copa); arvore.position.set(x, 0.15, z); scene.add(arvore);
        }
        criarArvore(-13, -5); criarArvore(-13, 8); criarArvore(13, -8); criarArvore(13, 6);

        const estruturaMat = new THREE.MeshStandardMaterial({ color: 0xeeeeee, metalness: 0.2 });
        const pilar1 = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 7), estruturaMat); pilar1.position.set(-5, 3.5, -2); scene.add(pilar1);
        const pilar2 = pilar1.clone(); pilar2.position.x = 5; scene.add(pilar2);
        const teto = new THREE.Mesh(new THREE.BoxGeometry(15, 0.5, 9), estruturaMat); teto.position.set(0, 7, 1); scene.add(teto);

        const paredeLoja = new THREE.Mesh(new THREE.BoxGeometry(16, 6, 5), new THREE.MeshStandardMaterial({color: 0xdddddd})); paredeLoja.position.set(0, 3, -12); scene.add(paredeLoja);

        // --- TEXTURA DA TELA ---
        const canvasTela = document.getElementById('totem-screen-canvas');
        const ctxTela = canvasTela.getContext('2d');
        const texturaTela = new THREE.CanvasTexture(canvasTela);

        function atualizarDisplayTotem(txt1, txt2) {
            ctxTela.fillStyle = '#001a33'; ctxTela.fillRect(0, 0, 256, 128);
            ctxTela.strokeStyle = '#00f2ff'; ctxTela.lineWidth = 6; ctxTela.strokeRect(4, 4, 248, 120);
            ctxTela.fillStyle = '#00f2ff'; ctxTela.font = 'bold 24px monospace'; ctxTela.textAlign = 'center'; ctxTela.fillText(txt1, 128, 50);
            ctxTela.fillStyle = '#00ff88'; ctxTela.font = 'bold 28px monospace'; ctxTela.fillText(txt2, 128, 95); texturaTela.needsUpdate = true;
        }
        atualizarDisplayTotem("SISTEMA READY", "DIST: 5.00m");

        // --- CARREGADOR / TOTEM ---
        const totemGroup = new THREE.Group(); totemGroup.position.set(0, 0, -1.2);
        const corpoTotem = new THREE.Mesh(new THREE.BoxGeometry(1.5, 3.8, 0.8), new THREE.MeshStandardMaterial({color: 0x242528, roughness: 0.5})); corpoTotem.position.y = 1.9; totemGroup.add(corpoTotem);

        const displayDigital = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 0.55), new THREE.MeshBasicMaterial({map: texturaTela})); displayDigital.position.set(0, 2.5, 0.41); totemGroup.add(displayDigital);
        const ledVermelho = new THREE.Mesh(new THREE.SphereGeometry(0.05, 16, 16), new THREE.MeshStandardMaterial({color: 0xff0000, emissive: 0xff0000})); ledVermelho.position.set(-0.35, 3.3, 0.41); totemGroup.add(ledVermelho);
        const ledVerde = new THREE.Mesh(new THREE.SphereGeometry(0.05, 16, 16), new THREE.MeshStandardMaterial({color: 0x002200, emissive: 0x000000})); ledVerde.position.set(0.35, 3.3, 0.41); totemGroup.add(ledVerde);

        const sensorCorpo = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.12, 0.1), new THREE.MeshStandardMaterial({color: 0x000000})); sensorCorpo.position.set(0, 1.4, 0.42); totemGroup.add(sensorCorpo);

        const rasgoTrilho = new THREE.Mesh(new THREE.BoxGeometry(0.3, 1.2, 0.05), new THREE.MeshStandardMaterial({color: 0x111})); rasgoTrilho.position.set(0, 0.7, 0.39); totemGroup.add(rasgoTrilho);

        // --- MECANISMO DO ATUADOR ---
        const movableArm = new THREE.Group();
        movableArm.position.set(0, 0.45, 0.4); 

        const baseMecanica = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.4, 0.3), new THREE.MeshStandardMaterial({color: 0x0d0e10})); baseMecanica.castShadow = true; movableArm.add(baseMecanica);
        const hastePiston = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.6, 16), new THREE.MeshStandardMaterial({color: 0xcccccc, metalness: 0.9, roughness: 0.1})); hastePiston.rotation.x = Math.PI/2; hastePiston.position.z = 0.3; movableArm.add(hastePiston);

        const acopladorNegro = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.1, 32), new THREE.MeshStandardMaterial({color: 0x333333, roughness: 0.6})); acopladorNegro.rotation.x = Math.PI/2; acopladorNegro.position.z = 0.6; acopladorNegro.castShadow = true;
        
        const pinoMat = new THREE.MeshStandardMaterial({color: 0xd4af37, metalness: 0.8, roughness: 0.2});
        const pinoGeo = new THREE.CylinderGeometry(0.02, 0.02, 0.15, 16); 
        
        const pin1 = new THREE.Mesh(pinoGeo, pinoMat);
        pin1.rotation.x = Math.PI / 2; pin1.position.set(-0.05, 0.07, 0); 
        
        const pin2 = new THREE.Mesh(pinoGeo, pinoMat);
        pin2.rotation.x = Math.PI / 2; pin2.position.set(0.05, 0.07, 0); 
        
        acopladorNegro.add(pin1, pin2);
        movableArm.add(acopladorNegro);
        totemGroup.add(movableArm); scene.add(totemGroup);

        // --- VEÍCULO: BYD DOLPHIN MINI ---
        const carGroup = new THREE.Group(); carGroup.position.set(0, 0, 9);
        let modeloCarregado = false; const gltfLoader = new THREE.GLTFLoader();

        gltfLoader.load('scene.gltf', (gltf) => {
            const carModel = gltf.scene; const box = new THREE.Box3().setFromObject(carModel); const size = box.getSize(new THREE.Vector3()); const center = box.getCenter(new THREE.Vector3());
            carModel.position.x += (carModel.position.x - center.x); carModel.position.y += (carModel.position.y - center.y); carModel.position.z += (carModel.position.z - center.z);
            carModel.scale.set(3.4/size.z, 3.4/size.z, 3.4/size.z); carModel.traverse((node) => { if (node.isMesh) node.castShadow = true; }); carGroup.add(carModel); modeloCarregado = true;
        }, undefined, (e) => {
            const chassi = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.7, 3.4), new THREE.MeshStandardMaterial({ color: 0x00f2ff, metalness: 0.5, roughness: 0.2 })); chassi.position.y = 0.45; chassi.castShadow = true;
            const cabine = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.65, 1.8), new THREE.MeshStandardMaterial({ color: 0x111111, transparent: true, opacity: 0.85 })); cabine.position.set(0, 1.05, -0.2); carGroup.add(chassi, cabine);
            const rodaGeo = new THREE.CylinderGeometry(0.28, 0.28, 0.25, 24); rodaGeo.rotateZ(Math.PI/2); const rodaMat = new THREE.MeshStandardMaterial({color: 0x151515, roughness: 0.8});
            const r1 = new THREE.Mesh(rodaGeo, rodaMat); r1.position.set(-0.85, 0.28, 1); const r2 = r1.clone(); r2.position.x = 0.85; const r3 = r1.clone(); r3.position.z = -1; const r4 = r2.clone(); r4.position.z = -1;
            carGroup.add(r1, r2, r3, r4); modeloCarregado = true;
        });

        const moduloReceptorFemea = new THREE.Group();
        moduloReceptorFemea.position.set(0, 0.45, -1.71); 

        const caixaAmarela = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.22, 0.04), new THREE.MeshStandardMaterial({color: 0xffaa00, roughness: 0.4}));
        moduloReceptorFemea.add(caixaAmarela);

        const entradaFemeaMat = new THREE.MeshStandardMaterial({color: 0x111111, roughness: 0.9});
        const entradaFemeaGeo = new THREE.CylinderGeometry(0.025, 0.025, 0.01, 16); entradaFemeaGeo.rotateX(Math.PI/2);
        
        const furo1 = new THREE.Mesh(entradaFemeaGeo, entradaFemeaMat); furo1.position.set(-0.05, 0, 0.02);
        const furo2 = furo1.clone(); furo2.position.x = 0.05;
        moduloReceptorFemea.add(furo1, furo2);

        carGroup.add(moduloReceptorFemea);
        scene.add(carGroup);

        // --- LÓGICA DE CONTROLE ---
        let state = "IDLE"; let distance = 5.0; let battery = 15;
        const uiDist = document.getElementById('dist-val'); const uiAct = document.getElementById('act-val');
        const uiMag = document.getElementById('mag-val'); const uiStat = document.getElementById('main-status');
        const uiBatTxt = document.getElementById('bat-perc'); const uiBatBar = document.getElementById('battery-level');
        const btnActuator = document.getElementById('actuator-btn');

        // Eventos MQTT
        mqttClient.on("connect", () => {
            console.log("Conectado ao Broker MQTT!");
            mqttClient.subscribe(TOPIC_STATUS);
            uiStat.innerText = "Nuvem Conectada. Clique em Iniciar Simulação.";
        });

        mqttClient.on("message", (topic, message) => {
            if (topic === TOPIC_STATUS && message.toString() === "ONLINE") {
                uiStat.innerText = "ESP32-S3 Online e Sincronizada!";
            }
        });

        function enviarComandoESP32(cmd, l1, l2) {
            if (mqttClient && mqttClient.connected) {
                mqttClient.publish(TOPIC_CMD, JSON.stringify({ cmd, l1, l2 }));
            }
        }

        function iniciar() { 
            simulacaoAtiva = true; 
            document.getElementById('start-btn').disabled = true; 
            uiStat.innerText = "Use a barra 'Simular Aproximação' para estacionar.";
            enviarComandoESP32("IDLE", "SISTEMA ATIVO", "APROXIME O EV");
        }

        function atualizarDistanciaManual(valor) {
            if (!simulacaoAtiva) return;
            distance = parseFloat(valor);

            if (state === "IDLE" || state === "PARKED_WAITING") {
                carGroup.position.z = distance + 1.71 - 0.4;

                if (distance <= 0.48) {
                    state = "PARKED_WAITING";
                    btnActuator.disabled = false;
                    uiStat.innerText = "Estacionado. Módulo fêmea pronto para acoplar.";
                    if (ultimoEstadoEnviado !== "PARKED") {
                        ultimoEstadoEnviado = "PARKED";
                        enviarComandoESP32("PARKED", "EV DETECTADO", "PRONTO P/ ACOPLAR");
                    }
                } else {
                    state = "IDLE";
                    btnActuator.disabled = true;
                    uiStat.innerText = "Aproximando veículo da vaga...";
                    if (ultimoEstadoEnviado !== "IDLE") {
                        ultimoEstadoEnviado = "IDLE";
                        enviarComandoESP32("IDLE", "APROXIME O EV", "DIST: " + distance.toFixed(2) + "m");
                    }
                }
            }
        }

        function acionarAtuador() { 
            if (state === "PARKED_WAITING") {
                state = "ACTUATOR_MOVING"; 
                btnActuator.disabled = true;
                enviarComandoESP32("START", "ACOPLANDO...", "INDUCAO ATIVA");
            }
        }

        function botaoStopEmergencia() { 
            state = "E_STOP"; 
            btnActuator.disabled = true;
            enviarComandoESP32("STOP", "E-STOP ACIONADO", "SISTEMA TRAVADO");
        }

        function subirAtuador() {
            if (state === "IDLE" || state === "PARKED_WAITING") {
                if (movableArm.position.y < 1.1) {
                    movableArm.position.y += 0.02; 
                    document.getElementById('alt-val').innerText = movableArm.position.y.toFixed(2) + " m";
                }
            }
        }

        function descerAtuador() {
            if (state === "IDLE" || state === "PARKED_WAITING") {
                if (movableArm.position.y > 0.2) {
                    movableArm.position.y -= 0.02; 
                    document.getElementById('alt-val').innerText = movableArm.position.y.toFixed(2) + " m";
                }
            }
        }

        function resetar() {
            simulacaoAtiva = false;
            ultimoEstadoEnviado = "";
            cargaConcluidaEnviada = false;
            state = "IDLE"; 
            battery = 15; 
            distance = 5.0;
            document.getElementById('sim-dist-slider').value = "5.00";
            carGroup.position.set(0, 0, 9);
            movableArm.position.z = 0.4; 
            movableArm.position.y = 0.45;
            document.getElementById('start-btn').disabled = false; 
            btnActuator.disabled = true;
            uiStat.innerText = "Aguardando Aproximação"; 
            uiStat.style.color = ""; 
            uiAct.innerText = "Recuado"; 
            uiMag.innerText = "OFF"; 
            uiMag.style.color = "";
            document.getElementById('alt-val').innerText = "0.45 m";
            ledVermelho.material.emissive.setHex(0xff0000); 
            ledVerde.material.emissive.setHex(0x000000);
            atualizarDisplayTotem("SISTEMA READY", "DIST: 5.00m");
            
            enviarComandoESP32("RESET", "SISTEMA READY", "AGUARD. INICIO");
        }

        // --- ANIMATE INTEGRADO ---
        function animate() {
            requestAnimationFrame(animate); controls.update();
            
            uiDist.innerText = distance.toFixed(2) + " m";
            uiBatTxt.innerText = Math.floor(battery) + "%"; uiBatBar.style.width = battery + "%";

            switch (state) {
                case "IDLE":
                    atualizarDisplayTotem("APROXIME O EV", "DIST: " + distance.toFixed(2) + "m");
                    break;
                case "PARKED_WAITING":
                    atualizarDisplayTotem("EV DETECTADO", "ALINHAR Y/Z");
                    break;
                case "ACTUATOR_MOVING":
                    uiStat.innerText = "Avançando Atuador Macho..."; uiAct.innerText = "Avançando...";
                    atualizarDisplayTotem("CONNECTING...", "EIXO Z ACT");
                    if (movableArm.position.z < 0.56) {
                        movableArm.position.z += 0.006;
                    } else { state = "COUPLING"; }
                    break;
                case "E_STOP":
                    uiStat.innerText = "⛔ PARADA DE EMERGÊNCIA ACIONADA!"; uiStat.style.color = "#ff2222";
                    atualizarDisplayTotem("⚠️ E-STOP! ⚠️", "SISTEMA RETIDO");
                    ledVermelho.material.emissive.setHex(0xff0000); ledVerde.material.emissive.setHex(0x000000);
                    if (movableArm.position.z > 0.4) movableArm.position.z -= 0.02;
                    break;
                case "COUPLING":
                    uiMag.innerText = "ACOPLADO (CONECTADO)"; uiMag.style.color = "#00ff88"; uiAct.innerText = "Acoplado";
                    ledVermelho.material.emissive.setHex(0x000000); ledVerde.material.emissive.setHex(0x00ff00);
                    enviarComandoESP32("START", "CARREGANDO EV", "INDUCAO ATIVA");
                    state = "CHARGING";
                    break;
                case "CHARGING":
                    uiStat.innerText = "Energia ativa: Macho encaixado na Fêmea"; uiStat.style.color = "#00ff88";
                    if (battery < 100) {
                        battery += 0.06;
                        atualizarDisplayTotem("CARREGANDO EV", "BAT: " + Math.floor(battery) + "%");
                    } else {
                        battery = 100;
                        atualizarDisplayTotem("CARGA COMPLETA", "BAT: 100%");
                        if (!cargaConcluidaEnviada) {
                            cargaConcluidaEnviada = true;
                            enviarComandoESP32("STOP", "CARGA COMPLETA", "BAT: 100%");
                        }
                    }
                    break;
            }
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        animate();
    </script>
</body>
</html>
